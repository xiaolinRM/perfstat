#========================================================================================
# perfstat.ini —— 可选配置
#
# 放在下面任一位置都会被自动读取（按顺序查找，命中第一个就用它）：
#   1. addons/perfstat.ini                     ← 插件同目录，⭐ 推荐放这里
#   2. addons/cfg/perfstat.ini
#   3. 服务器根目录（工作目录）下的 perfstat.ini
#   4. srcds 可执行文件同目录下的 perfstat.ini （兜底）
#
# 插件启动横幅会打印实际读到的是哪一份：
#   配置: 已读取 .../left4dead2/addons/perfstat.ini
# 没有这一行就说明一份都没读到（此时全部用默认值）。
#
# 想改完立刻生效：控制台执行 perf_load（不需要重启，也不需要重载插件）
# 全部键都可以省略，省略时用括号里的默认值。
#========================================================================================

# 采样间隔（毫秒，默认 10）
#   越小越精细，但每次挂起线程的次数也越多。建议 5 ~ 50。
#   CPU 很吃紧的服可以调到 20~50；想抓瞬时尖峰可以调到 5。
sample_ms = 10

# 默认采样时长（秒，0 = 不自动停止，默认 0）
#   设成 60 后，执行 perf_start 会跑 60 秒然后自动停下来并提示你看报告。
duration_sec = 0

# perf_stat 在控制台打印多少行（默认 25）
console_top = 25

# 每个模块展开显示多少个热点函数/偏移（默认 8）
hotspot_top = 8

# 热点显示门槛：至少被采到多少次才显示（默认 2）
#   调大可以过滤掉只命中一两次的噪声。
hotspot_min_hits = 2

# 默认是否展开热点（0/1，默认 0）
#   设为 1 后 perf_stat 也会附带热点明细（等价于 perf_top）。
show_hotspot = 0

# 默认是否附带线程明细（0/1，默认 0）
show_threads = 0

# 插件加载后是否自动开始采样（0/1，默认 1）
#   采样开销不大（默认间隔下约 1~3% CPU），想彻底零开销就设 0，
#   之后手动 perf_start。
#   注意：设 0 之后必须用 perf_start 才能采到数据。
auto_start = 1

# 自动落盘周期（秒，0 = 关闭，默认 0）
#   用于长期观察：每隔这么久自动往 logs 目录写一份报告。
auto_dump_sec = 0

# 固定落盘路径（留空 = logs/perfstat-时间戳.log）
# 配合 duration_sec 使用时，跑完会自动写到这里。
# auto_dump_path = logs/perfstat-latest.log

# 卸载后是否刻意让本模块留在内存里（0/1，默认 1）
#
#   强烈建议保持 1。原因：引擎的插件接口没有"通知引擎清理引用"的机制，
#   plugin_unload 让模块被 unmapped 之后，引擎侧残留的指针（命令对象、名字字符串、
#   命令链表节点）一旦被访问就会崩溃 —— 典型症状是卸载后在客户端输入框里
#   打任意一个字就崩（崩溃点 gameui.dll，输入框每次按键都会遍历命令表）。
#
#   设成 1 时，插件会给自己 +1 模块引用计数，引擎的 FreeLibrary/dlclose 扣不掉它，
#   模块就一直是"有效但不再使用"的内存，不会再崩。
#   代价：卸载后代码/数据仍占几百 KB 常驻内存（插件卸载后进程通常马上要结束，可忽略）。
#
#   只有在你明确要"彻底卸载、连内存一起还回去"时才设 0。
keep_mapped = 1

# 只统计"正在占用 CPU"的线程（0/1，默认 1）
#
#   ★ 这个开关决定 CPU 占比有没有意义，强烈建议保持 1 ★
#
#   采样是"给线程投信号、取它当时的指令指针"。但阻塞在 futex/epoll/nanosleep 里的
#   空闲线程，指令指针恰好停在 libc（Linux）/ ntdll（Windows）的系统调用包装里 ——
#   被采样到就把这一票算给了系统库。
#
#   服务器上大量工作线程平时都在阻塞等待，于是 libc/ntdll 的占比被抬到 90% 以上，
#   真正在跑的模块只剩零点几个百分点，谁高谁低完全看不出来（实测症状）。
#
#   打开后只采样"运行态"线程：
#     Linux  : /proc/self/task/<tid>/stat 第 3 字段 == 'R'
#     Windows: NtQueryInformationThread 的 WaitReason == 0（不在等待）
#   实测效果：归因率从 50% 提升到 98%（采到的样本几乎全是真在跑的线程）。
#
#   只有在你明确想看"线程都阻塞在哪些系统调用上"时才设 0。
cpu_state_filter = 1
