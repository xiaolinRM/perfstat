name: build

# 触发方式：
#   * 手动：Actions 页面 -> build -> Run workflow
#   * 推送到 main / master
#   * 提 PR
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [main, master]

jobs:
  # ======================================================================================
  # Windows：编 32 位 perfstat.dll，跑两个自检，打包上传
  # ======================================================================================
  windows:
    name: Windows (Win32 / MSVC)
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 32 位 MSVC 环境
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: 显示工具链版本
        shell: cmd
        run: cl 2>&1 | findstr /C:"Version"

      # ---- 编译插件 ----
      - name: 编译 perfstat.dll
        shell: cmd
        run: |
          call build_win32.bat
          if errorlevel 1 exit /b 1

      # ---- 校验产物：32 位 + 导出 CreateInterface ----
      - name: 校验产物
        shell: pwsh
        run: |
          if (-not (Test-Path build\perfstat.dll)) { throw "build\perfstat.dll 不存在" }
          $headers = dumpbin /headers build\perfstat.dll
          if ($LASTEXITCODE -ne 0) { throw "dumpbin /headers 失败" }
          if (-not ($headers -match 'machine \(x86\)')) { throw "产物不是 32 位 x86" }

          $exports = dumpbin /exports build\perfstat.dll
          if ($LASTEXITCODE -ne 0) { throw "dumpbin /exports 失败" }
          if (-not ($exports -match 'CreateInterface')) { throw "产物没有导出 CreateInterface" }
          $exports | Select-String 'CreateInterface'
          Write-Host "产物校验通过：32 位，导出 CreateInterface"

      # ---- 算法/ABI 自检 ----
      # 注意：这里用【退出码】判断成败，不要用 findstr 去匹配中文（"失败 0 项"）。
      # findstr 对 UTF-8 中文的匹配不可靠，即使测试全过也会判成失败。
      # 自检程序本身在失败时返回 1、成功返回 0。
      - name: 编译并运行算法自检
        shell: cmd
        run: |
          call tools\build_tests.bat
          if errorlevel 1 exit /b 1
          build\perfstat_tests.exe > build\selftest.log 2>&1
          if errorlevel 1 (
            echo [ERROR] perfstat_tests.exe reported failures
            type build\selftest.log
            exit /b 1
          )
          type build\selftest.log
          echo [OK] perfstat_tests.exe passed

      # ---- 加载自检 ----
      - name: 编译并运行加载自检
        shell: cmd
        run: |
          call tools\build_loader_test.bat
          if errorlevel 1 exit /b 1
          build\perfstat_loader_test.exe > build\loader_test.log 2>&1
          if errorlevel 1 (
            echo [ERROR] perfstat_loader_test.exe reported failures
            type build\loader_test.log
            exit /b 1
          )
          type build\loader_test.log
          echo [OK] perfstat_loader_test.exe passed

      # ---- 打包 ----
      # 目录结构照 Source 插件的通行做法：vdf 和 dll 都放在 addons/ 里面。
      #
      # 【重要】两个平台的 zip 内部层级必须一致：
      #   perfstat-windows/addons/perfstat.dll
      #   perfstat-linux/addons/perfstat.so
      # 都是"一层与 zip 同名的目录"。汇总打包就是靠这个一致性才敢统一解包到 bundle/。
      # 原来 Windows 压成了没有顶层目录的结构（addons/... 直接在根），
      # 于是汇总步骤报"缺 windows 插件"（踩过）。
      #
      # 另外上传 artifact 时【只传 zip 文件本身】，不要把 dist/ 整个目录传上去 ——
      # dist/ 里同时有解包目录，一起传的话 artifact（本身也是 zip）里会同时含
      # 目录和 zip，用户下载解压就是"解压后还是同名 zip"（踩过）。
      - name: 打包 Windows 产物
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # 关掉进度条：Compress-Archive 内部的 Write-Progress 在非交互控制台上
          # 会抛 "Win32 internal error Access is denied while reading the console
          # output buffer"，导致整个打包步骤失败（本地实测踩过）。
          $ProgressPreference = 'SilentlyContinue'
          Remove-Item -Recurse -Force dist -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path dist\perfstat-windows\addons | Out-Null

          # 插件本体 + 自动加载配置 + 示例配置：全部放进 addons/
          Copy-Item build\perfstat.dll   -Destination dist\perfstat-windows\addons\
          Copy-Item perfstat.vdf         -Destination dist\perfstat-windows\addons\
          Copy-Item perfstat.ini         -Destination dist\perfstat-windows\addons\
          Copy-Item README.md            -Destination dist\perfstat-windows\

          # 自检程序与日志单独放 tests/，不要跟插件本体混在一起
          New-Item -ItemType Directory -Force -Path dist\perfstat-windows\tests | Out-Null
          Copy-Item build\perfstat_tests.exe,build\perfstat_loader_test.exe -Destination dist\perfstat-windows\tests\
          Copy-Item build\selftest.log,build\loader_test.log -Destination dist\perfstat-windows\tests\

          Push-Location dist
          # 【结构与 Linux 保持一致】zip 里要带一层 perfstat-windows/ 目录。
          #
          # 为什么：Linux 那边是 `zip -r perfstat-linux.zip perfstat-linux`，条目形如
          #   perfstat-linux/addons/perfstat.so
          # 如果 Windows 这边压成 `addons/perfstat.dll`（没有顶层目录），两个 zip 的
          # 内部层级就不一样了 —— 汇总打包时解包目标目录没法统一，很容易错
          # （踩过：bundle 步骤报"缺 windows 插件"）。
          # 所以这里压整个目录，让条目变成 perfstat-windows/addons/perfstat.dll。
          Compress-Archive -Path .\perfstat-windows -DestinationPath perfstat-windows.zip -Force
          Pop-Location

          # 校验：条目层级必须和 Linux 一致，且不能嵌套 zip
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $z = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path dist\perfstat-windows.zip))
          # 统一成正斜杠再校验：Compress-Archive 在不同环境下可能写出反斜杠，
          # 而 Linux 的 unzip / 汇总打包都按正斜杠处理，这里不规范化就会误报（实测踩过）。
          $entries = @($z.Entries | ForEach-Object { $_.FullName.Replace('\', '/') })
          $z.Dispose()
          Write-Host "zip 条目:"
          $entries | ForEach-Object { Write-Host "  $_" }
          if ($entries -match '\.zip$') {
            Write-Error "zip 里还嵌套了 zip！"
            exit 1
          }
          if (-not ($entries -match '^perfstat-windows/addons/perfstat\.dll$')) {
            Write-Error "zip 里没有 perfstat-windows/addons/perfstat.dll（顶层目录层级不对）"
            exit 1
          }
          if (-not ($entries -match '^perfstat-windows/addons/perfstat\.vdf$')) {
            Write-Error "zip 里没有 perfstat-windows/addons/perfstat.vdf"
            exit 1
          }
          $tops = @($entries | ForEach-Object { ($_ -split '/')[0] } | Sort-Object -Unique)
          Write-Host "顶层条目: $($tops -join ', ')"
          if ($tops.Count -ne 1 -or $tops[0] -ne 'perfstat-windows') {
            Write-Error "zip 顶层应该只有 perfstat-windows/ 一个条目"
            exit 1
          }

      # 【上传"干净暂存目录"里的内容】
      #
      # 为什么这么做：GitHub 的 artifact 本身就是一个 zip，如果 artifact 里再出现任何
      # .zip 文件，用户解压后就会看到"zip 里还有 zip"（反馈过多次）。
      # 与其依赖通配符的收集规则，不如先构造一个【确定不含任何 zip】的暂存目录，
      # 在打包前主动扫一遍，确认没有 zip 再上传 —— 这样 upload 就绝无可能带上 zip。
      - name: 准备上传目录（并确认里面没有任何 zip）
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = 'upload-windows'
          Remove-Item -Recurse -Force $stage -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -Recurse -Force dist\perfstat-windows\* $stage
          $zips = @(Get-ChildItem -Recurse -File -Filter *.zip $stage)
          if ($zips.Count -gt 0) {
            Write-Error "暂存目录里出现了 zip（这会导致 artifact 里嵌套 zip）：$($zips.FullName -join ', ')"
            exit 1
          }
          Write-Host "暂存目录内容（应无 zip）:"
          Get-ChildItem -Recurse $stage | ForEach-Object { Write-Host "  $($_.FullName.Replace($PWD.Path + '\', ''))" }

      - name: 上传 Windows 产物
        uses: actions/upload-artifact@v4
        with:
          name: perfstat-windows
          path: upload-windows
          if-no-files-found: error

  # ======================================================================================
  # Linux：编 32 位 perfstat.so，跑 POSIX 加载自检，打包上传
  # ======================================================================================
  # Linux：在【老 glibc 容器】里编 32 位 perfstat.so
  #
  # 【为什么必须用容器】这是踩过的真坑：
  #   GitHub 的 ubuntu-latest 现在是 Ubuntu 24.04（glibc 2.39）。gcc 会把"编译机上
  #   可见的符号版本"写进产物，于是编出来的 .so 要求 GLIBC_2.36 —— 而 Ubuntu 22.04
  #   只有 glibc 2.35，用户那边直接加载失败：
  #       version `GLIBC_2.36' not found
  #
  #   glibc 是【向后兼容】的：在老系统上编出来的产物，能在新系统上跑；反过来不行。
  #   所以在老 glibc 容器里编译，是产出"到处都能跑"的 Linux 二进制的标准作法。
  #   （注意 -static-libstdc++ 只解决 libstdc++，解决不了 glibc —— 这是两件事。）
  #
  #   选 ubuntu:20.04 = glibc 2.31：比 CentOS 7(2.17) / Ubuntu 18.04(2.27) 新一点点，
  #   但比 Ubuntu 22.04(2.35) 低，实测覆盖足够；而且软件源还在正常提供服务。
  # ======================================================================================
  linux:
    name: Linux (i386 / g++)
    runs-on: ubuntu-latest
    container: ubuntu:20.04

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 同一段脚本要在两种环境里都能跑：
      #   * 在容器里（ubuntu:20.04）—— 直接 apt-get，我们就是 root
      #   * 万一容器不可用、降级到宿主机 —— 需要 sudo
      # 用 sudo -n true 探测，两套都覆盖，这样"容器挂掉"不会让整个 CI 变红。
      - name: 安装 32 位编译环境
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -e
          if sudo -n true 2>/dev/null; then SUDO="sudo"; else SUDO=""; fi
          $SUDO dpkg --add-architecture i386 2>/dev/null || true
          $SUDO apt-get update
          # 注意：ubuntu 基础镜像【没有 unzip】，而打包步骤要校验 zip 结构。
          # 一开始漏了它，CI 直接 `unzip: not found` 退出码 127（踩过）。
          # 现在改用 zip 自带的 zipinfo 做校验（见打包步骤），unzip 仍然装上
          # 是为了顺手能用、也避免其他地方用到时再踩一次。
          $SUDO apt-get install -y --no-install-recommends \
            g++ g++-multilib make file zip unzip binutils ca-certificates
          # 确认 32 位目标可用（多架构头文件位于 /usr/include/i386-linux-gnu）
          test -d /usr/include/i386-linux-gnu || echo "警告: 没找到 i386 头文件目录"

      # ---------------------------------------------------------------------------------
      # 预检：把后面所有步骤要用到的命令先确认一遍
      #
      # 【为什么加这一步】踩过：ubuntu 基础镜像里没有 unzip，而打包步骤要校验 zip ——
      # 于是"编译、校验、自检全过了"，最后倒在打包，报一个 `unzip: not found` 退出码 127。
      # 在这里一次性检查，缺什么当场列出来，不用一步步试。
      # ---------------------------------------------------------------------------------
      - name: 预检所需命令
        run: |
          set -e
          MISSING=""
          for c in g++ make file zip zipinfo objdump nm ldd timeout stat; do
            if ! command -v "$c" >/dev/null 2>&1; then
              MISSING="$MISSING $c"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::缺少命令:$MISSING"
            echo "::error::请把对应软件包加进上面的 apt-get install（zipinfo 由 zip 提供）。"
            exit 1
          fi
          echo "预检通过：全部命令可用"

      - name: 显示工具链与 glibc 版本
        run: |
          g++ --version | head -1
          echo "编译机 glibc: $(ldd --version | head -1)"

      - name: 编译 perfstat.so
        run: make

      # ---- 校验产物：32 位 ELF + 导出符号 ----
      - name: 校验产物
        run: |
          set -e
          test -f Release/perfstat.so || { echo "没有生成 Release/perfstat.so"; exit 1; }
          file Release/perfstat.so
          file Release/perfstat.so | grep -q "ELF 32-bit"
          nm -D --defined-only Release/perfstat.so | grep -E "CreateInterface|perfstat_factory"
          echo "产物校验通过：32 位 ELF，导出 CreateInterface / perfstat_factory"

      # ---- 【关键】校验 glibc 版本上限 ----
      #
      # 这一步是防回归的核心：只要将来编译机的 glibc 又变新（例如容器忘了固定、
      # 或换回 ubuntu-latest），这里会立刻失败，而不是等用户装完才发现
      # "version `GLIBC_2.xx' not found"。
      #
      # 原则：产物要求的最高 GLIBC_ 版本必须 <= 目标系统的最低 glibc。
      #   ubuntu:20.04 编译 -> 要求约 GLIBC_2.28 左右；上限设 2.31 留足余量。
      - name: 校验 glibc 版本兼容性
        run: |
          set -e
          echo "=== 产物需要的 GLIBC_* 版本 ==="
          objdump -T Release/perfstat.so | grep -o 'GLIBC_[0-9.]*' | sort -V -u
          NEED=$(objdump -T Release/perfstat.so | grep -o 'GLIBC_[0-9.]*' | sort -V -u | tail -1)
          echo "产物最高要求: $NEED"

          # 编译机自己的 glibc 版本 —— 用它当上限。
          # 这样无论跑在容器里(2.31)还是降级到较新的宿主机，判断都成立，
          # 而且能精确指出"是不是编译环境变新了"。
          HOSTV=$(ldd --version | head -1 | grep -o '[0-9]\+\.[0-9]\+$' | head -1)
          echo "编译机 glibc: $HOSTV"
          MAX="GLIBC_$HOSTV"

          NEWEST=$(printf '%s\n%s\n' "$NEED" "$MAX" | sort -V | tail -1)
          if [ "$NEWEST" != "$MAX" ] && [ "$NEED" != "$MAX" ]; then
            echo "::error::产物要求 $NEED，比编译机自身的 $MAX 还新 —— 这不可能，说明解析出错"
            exit 1
          fi

          # 真正要防的是"编译机太新"：容器固定为 ubuntu:20.04(glibc 2.31)，
          # 一旦它失效/被改成更新的镜像，这里会立刻报警。
          LIMIT=2.31
          OVER=$(printf '%s\n%s\n' "$HOSTV" "$LIMIT" | sort -V | tail -1)
          if [ "$HOSTV" != "$LIMIT" ] && [ "$OVER" = "$HOSTV" ]; then
            echo "::error::编译机 glibc 是 $HOSTV，高于预期上限 $LIMIT"
            echo "::error::这会让产物的 glibc 要求变高，老系统用户会报 version \`GLIBC_x.yz' not found。"
            echo "::error::请确认 linux job 的 container 仍是 ubuntu:20.04（不要换成更新的镜像）。"
            exit 1
          fi
          echo "OK: 编译机 glibc $HOSTV <= $LIMIT，产物要求 $NEED"

          echo "=== 确认 C++ 运行库已静态链接（应为空）==="
          CXXVER=$(objdump -T Release/perfstat.so | grep -o -e 'GLIBCXX_[0-9.]*' -e 'CXXABI_[0-9.]*' | sort -u || true)
          if [ -n "$CXXVER" ]; then
            echo "::error::产物仍依赖动态 libstdc++：$CXXVER"
            echo "::error::Makefile 里的 -static-libstdc++ 是不是被去掉了？"
            exit 1
          fi
          echo "OK: 无 GLIBCXX / CXXABI 动态依赖"

          echo "=== 动态库依赖（应只有 libc / ld-linux 之类的基础库）==="
          objdump -p Release/perfstat.so | grep NEEDED

      # ---- 自检 ----
      - name: 编译自检程序
        run: make -f tools/Makefile.linux_tests

      # 先跑“平台层冒烟测试”：只验证信号采样 / 模块枚举 / 符号解析，不加载插件。
      # 万一加载自检卡住，这一步能立刻说明问题出在平台层还是插件加载流程。
      # 同样用退出码判断（grep 中文不可靠）。
      - name: 运行平台层冒烟测试
        run: |
          set -e
          rc=0
          timeout 120 ./build/perfstat_smoke_linux 60 > build/smoke_linux.log 2>&1 || rc=$?
          echo "===== smoke log ====="
          cat build/smoke_linux.log
          if [ "$rc" != "0" ]; then
            echo "::error::平台层冒烟测试失败或超时（exit=$rc）"
            exit 1
          fi
          echo "平台层冒烟测试通过"

      # 再跑完整加载自检：dlopen 插件 + 假 ICvar + 指令注册/派发 + 真实采样
      # 2>&1 是为了同时收 stdout/stderr（看门狗会把卡住的阶段写进 stderr）
      - name: 运行加载自检
        run: |
          set -e
          rc=0
          timeout 180 ./build/perfstat_loader_test_linux Release/perfstat.so 120 \
              > build/loader_test_linux.log 2>&1 || rc=$?
          echo "===== loader test log ====="
          cat build/loader_test_linux.log
          if [ "$rc" != "0" ]; then
            echo "::error::Linux 加载自检失败或超时（exit=$rc）"
            exit 1
          fi
          echo "Linux 加载自检通过"

      # ---- 打包 ----
      # 目录结构照 Source 插件的通行做法：vdf 和 .so 都放在 addons/ 里面。
      #
      # 关于 zip 嵌套：用 `zip -r out.zip <dir>` 会把 dir 自己作为顶层条目写进 zip，
      # 解开就是 "perfstat-linux/..."，这本身是对的（一层目录，不是嵌套 zip）。
      # 真正造成"解压后还是 zip"的是上传了【两个 artifact】都要手动解压，
      # 以及汇总包里又打了一次 zip。这里统一成：产物 zip 里只有一层目录，
      # 并且校验 zip 内不含任何 .zip 条目。
      - name: 打包 Linux 产物
        run: |
          set -e
          rm -rf dist
          mkdir -p dist/perfstat-linux/addons dist/perfstat-linux/tests
          cp Release/perfstat.so            dist/perfstat-linux/addons/
          cp perfstat.vdf perfstat.ini      dist/perfstat-linux/addons/
          cp README.md                      dist/perfstat-linux/
          cp build/perfstat_loader_test_linux build/perfstat_smoke_linux dist/perfstat-linux/tests/
          cp build/loader_test_linux.log build/smoke_linux.log           dist/perfstat-linux/tests/
          cd dist && zip -r perfstat-linux.zip perfstat-linux
          # 【为什么用 zipinfo 而不是 unzip】zipinfo 由 zip 包自带，而 ubuntu 基础
          # 镜像里没有 unzip —— 之前打包步骤就是因为 `unzip: not found` 直接以
          # 退出码 127 失败（踩过）。用 zipinfo 就完全没有额外依赖了。
          # `zipinfo -1` 只列条目名；用 `zipinfo -l` 会把表头也算进去，
          # 那样 grep '\.zip$' 会误报"嵌套了 zip"。
          echo "--- zip 条目（应只有一层目录，且没有 .zip）---"
          zipinfo -l perfstat-linux.zip
          if zipinfo -1 perfstat-linux.zip | grep -qE '\.zip$'; then
            echo "::error::zip 里嵌套了 zip"
            zipinfo -1 perfstat-linux.zip | grep -E '\.zip$'
            exit 1
          fi
          zipinfo -1 perfstat-linux.zip | grep -q 'addons/perfstat.so' || {
            echo "::error::zip 里没有 addons/perfstat.so"; exit 1; }
          zipinfo -1 perfstat-linux.zip | grep -q 'addons/perfstat.vdf' || {
            echo "::error::zip 里没有 addons/perfstat.vdf"; exit 1; }
          # 顶层必须只有一个目录（避免又多一层）
          tops=$(zipinfo -1 perfstat-linux.zip | cut -d/ -f1 | sort -u | wc -l)
          echo "顶层条目数: $tops"
          test "$tops" = "1" || { echo "::error::zip 顶层不止一个条目"; exit 1; }
          # 注意：上面已经 cd 进 dist 了，这里只能 ls 当前目录。
          # 原来写的是 `ls -lR dist`，在 dist 里再找 dist 必然失败，
          # 而 set -e 会让整个打包步骤以退出码 2 结束（zip 其实已经成功了）。
          ls -lR .
          echo "zip 大小: $(stat -c %s perfstat-linux.zip) 字节"

      # 同 Windows：先造一个"确定不含 zip"的暂存目录，再上传
      - name: 准备上传目录（并确认里面没有任何 zip）
        run: |
          set -e
          rm -rf upload-linux && mkdir -p upload-linux
          cp -r dist/perfstat-linux/. upload-linux/
          if find upload-linux -name '*.zip' | grep -q .; then
            echo "::error::暂存目录里出现了 zip，artifact 会嵌套"; find upload-linux -name '*.zip'; exit 1
          fi
          echo "暂存目录内容（应无 zip）:"
          find upload-linux | sort

      - name: 上传 Linux 产物
        uses: actions/upload-artifact@v4
        with:
          name: perfstat-linux
          path: upload-linux
          if-no-files-found: error

  # ======================================================================================
  # 汇总：两个平台都成功后，再合并成一个总包，方便一次性下载
  # ======================================================================================
  bundle:
    name: 汇总打包
    runs-on: ubuntu-latest
    needs: [windows, linux]

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # artifact 里是解包后的【文件】，不是 zip。
      # download-artifact 会为每个 artifact 建一个子目录：
      #   artifacts/perfstat-windows/{addons,tests,README.md}
      #   artifacts/perfstat-linux/{addons,tests,README.md}
      - name: 下载两个平台的产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 检查下载结果
        run: |
          set -e
          # 注意：不要写 `ls -R artifacts` —— 目录不存在时 ls 返回非 0，
          # 在 set -e 下会直接让步骤以退出码 2 结束，把真正的错误掩盖掉（踩过：
          # 上一版因为漏掉了 download-artifact 这一步，报错只显示 "cannot access artifacts"）。
          if [ ! -d artifacts ]; then
            echo "::error::download-artifact 没有下载到任何东西（artifacts/ 不存在）"
            echo "::error::通常意味着 windows 或 linux job 在打包/上传之前就失败了，请看那两个 job 的日志。"
            exit 1
          fi
          echo "=== artifacts/ 结构 ==="
          find artifacts -maxdepth 3 | sort
          for plat in perfstat-windows perfstat-linux; do
            if [ ! -d "artifacts/$plat" ]; then
              echo "::error::缺少 artifact: $plat"
              exit 1
            fi
          done
          test -f artifacts/perfstat-windows/addons/perfstat.dll || {
            echo "::error::artifacts/perfstat-windows/addons/perfstat.dll 不存在"; exit 1; }
          test -f artifacts/perfstat-linux/addons/perfstat.so || {
            echo "::error::artifacts/perfstat-linux/addons/perfstat.so 不存在"; exit 1; }
          echo "两个平台的 artifact 都齐了（且是解包后的文件，不是 zip）"

      - name: 合并成一个总包
        run: |
          set -e
          rm -rf bundle && mkdir -p bundle
          cp -r artifacts/perfstat-windows bundle/perfstat-windows
          cp -r artifacts/perfstat-linux bundle/perfstat-linux
          # 校验：bundle 里不应该有 zip，且两个平台的关键文件都在
          if find bundle -name '*.zip' | grep -q .; then
            echo "::error::汇总目录里残留了 zip"; find bundle -name '*.zip'; exit 1
          fi
          test -f bundle/perfstat-windows/addons/perfstat.dll || {
            echo "::error::缺 windows 插件"; exit 1; }
          test -f bundle/perfstat-windows/addons/perfstat.vdf || {
            echo "::error::缺 windows vdf"; exit 1; }
          test -f bundle/perfstat-linux/addons/perfstat.so || {
            echo "::error::缺 linux 插件"; exit 1; }
          test -f bundle/perfstat-linux/addons/perfstat.vdf || {
            echo "::error::缺 linux vdf"; exit 1; }
          # 【不打 zip，直接交给 GitHub】
          #
          # GitHub 的 artifact 本身就是 zip：只要上传【一个文件夹】，用户下载解压后
          # 直接就是那个文件夹，不会出现"zip 里还有 zip"。
          # 之前我们自己先 zip 一遍再上传，就变成了"artifact.zip -> 我们的.zip -> 目录"，
          # 也就是"解压后还是同名 zip"的来源。
          echo "=== bundle 结构（将作为文件夹直接上传）==="
          find bundle | sort

      # 【上传文件夹本身，不打包】
      # GitHub 会自动把 artifact 打成 zip；用户下载解压后直接看到 perfstat-windows/
      # 和 perfstat-linux/ 两个目录，中间不再有任何多余的 zip 层。
      - name: 上传总包
        uses: actions/upload-artifact@v4
        with:
          name: perfstat-all-platforms
          path: bundle
          if-no-files-found: error
